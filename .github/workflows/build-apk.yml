name: Build and Release Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuroPlay-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "NuroPlay v1.0.0 (Android APK)"
          draft: false
          prerelease: false
          body: |
            ## 🎮 NuroPlay - Think Fast, Play Smart
            
            ### 📥 Download Android APK
            Click **`app-release.apk`** below to download and install on any Android phone!
            
            ### ✨ Features Included:
            - **Real-World Arcade Suite**: Paper Football, Jenga Tower, Cup Pong, Mini Carrom, Marble Knockout, Tic-Tac-Toe, Rock Paper Scissors, Four in a Row, Reflex Duel, and Paper Plane.
            - **👥 Multiplayer Options**: 2-Player Pass & Play, face-to-face split screen duels, and vs smart AI bots.
            - **Brain & Speed Math Challenges**: Speed calculation duels, memory matrix, pattern recall, and sliding puzzles.
          files: build/app/outputs/flutter-apk/app-release.apk
